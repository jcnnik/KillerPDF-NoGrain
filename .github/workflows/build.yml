name: Build KillerPDF without grain

on:
  schedule:
    - cron: '0 6 * * *'   # daily; does nothing unless upstream shipped a new release
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new upstream release
        id: v
        shell: pwsh
        run: |
          $tag = gh release view --repo SteveTheKiller/KillerPDF --json tagName -q .tagName
          if (!$tag) { throw 'Could not read upstream release' }
          # Done only if our release has both public exes (older releases had a single exe).
          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' 2>$null
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "built=$($assets -contains 'KillerPDF-Portable.exe')" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/checkout@v4
        if: steps.v.outputs.built == 'False'
        with:
          repository: SteveTheKiller/KillerPDF
          ref: ${{ steps.v.outputs.tag }}
          path: src

      - uses: actions/setup-dotnet@v4
        if: steps.v.outputs.built == 'False'
        with:
          global-json-file: src/global.json

      - name: Remove grain
        if: steps.v.outputs.built == 'False'
        shell: pwsh
        run: ./remove-grain.ps1 -Path src

      - name: Build
        if: steps.v.outputs.built == 'False'
        shell: pwsh
        # Upstream's own packaging: installer (KillerPDF.exe) + portable, unsigned.
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File src/build/build-packages.ps1
          if ($LASTEXITCODE) { throw 'Package build failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File src/build/bundle-source.ps1 `
            -ProjectDir "$PWD/src" -Version ('${{ steps.v.outputs.tag }}' -replace '^v') -AppName KillerPDF -PublishDir "$PWD/out"
          if ($LASTEXITCODE) { throw 'Source bundle failed' }
          Copy-Item src/bin/Release/net10.0-windows/publish/KillerPDF*.exe out

      - name: Release
        if: steps.v.outputs.built == 'False'
        shell: pwsh
        run: |
          $tag = '${{ steps.v.outputs.tag }}'
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes 2>$null
          gh release create $tag out/KillerPDF.exe out/KillerPDF-Portable.exe (Get-Item out/*-src.zip) `
            --repo $env:GITHUB_REPOSITORY --title "KillerPDF $tag (NO GRAIN)" `
            --notes "Upstream https://github.com/SteveTheKiller/KillerPDF/releases/tag/$tag with the film grain removed. KillerPDF.exe is the installer, KillerPDF-Portable.exe runs without installing. Builds are unsigned, so Windows SmartScreen may warn on first launch. The -src.zip is the patched source (GPL-3.0)."
